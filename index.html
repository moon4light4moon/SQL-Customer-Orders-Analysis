<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anastasia — My socials</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('background.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(14px);
      border-radius: 22px;
      padding: 30px 24px 26px;
      box-shadow: 0 0 25px rgba(0,0,0,0.45);
      max-width: 520px;
      width: 90%;
      text-align: center;
    }
    .avatar {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      margin: 10px auto 18px;
      display: block;
      border: 3px solid #ff007f;
      box-shadow: 0 0 18px rgba(255,0,150,0.8);
    }
    h1 {
      font-size: 28px;
      margin: 0 0 6px;
    }
    p.subtitle {
      margin: 0 0 18px;
      font-size: 16px;
      opacity: 0.9;
    }
    .links {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .link-btn {
      padding: 12px 16px;
      border-radius: 999px;
      background: #ff007f;
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease;
      border: 2px solid #ff007f;
      box-shadow: 0 4px 15px rgba(255,0,130,0.4);
      display: block;
    }
    .link-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 0 18px rgba(255,0,150,0.8), 0 0 28px rgba(255,0,150,0.5);
      opacity: 0.96;
    }
    @media (max-width: 480px) {
      .container {
        padding: 22px 16px 18px;
      }
      .avatar {
        width: 140px;
        height: 140px;
      }
      h1 {
        font-size: 24px;
      }
      .link-btn {
        font-size: 16px;
        padding: 11px 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="avatar.jpg" alt="Anastasia" class="avatar" />
    <h1>Anastasia</h1>
    <p class="subtitle">My socials</p>

    <div class="links">
      <a href="https://github.com/moon4light4moon" class="link-btn">🐙 GitHub</a>
      <a href="https://www.linkedin.com/in/sakada-anastasiia-62936b396/" class="link-btn">💼 LinkedIn</a>
      <a href="https://www.instagram.com/ana_ste_zia_?igsh=MWY4dWp0OTczbWNoNA%3D%3D&utm_source=qr" class="link-btn">📸 Instagram</a>
    </div>
  </div>
</body>
</html>
